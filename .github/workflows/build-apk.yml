name: Build HisabPro APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "platforms;android-36.1" || true

      - name: Ensure debug keystore exists for GitHub runner
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare direct HisabPro.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk HisabPro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-APK
          path: HisabPro.apk

      - name: Publish direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" HisabPro.apk --clobber
          else
            gh release create "$TAG" HisabPro.apk \
              --title "HisabPro Android APK" \
              --notes "Direct installable APK for HisabPro (commit ${{ github.sha }})."
          fi
